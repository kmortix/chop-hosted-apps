<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            border: 5px solid #333;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .cell:hover {
            background-color: #e0e0e0;
        }
        #message {
            margin-top: 20px;
            font-size: 1.5em;
            color: #007bff;
        }
        #reset-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #reset-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="game-board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <p id="message">Player X's Turn</p>
    <button id="reset-button">Reset Game</button>

    <script>
        const cells = document.querySelectorAll('.cell');
        const messageElement = document.getElementById('message');
        const resetButton = document.getElementById('reset-button');
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleResultValidation() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = board[winCondition[0]];
                let b = board[winCondition[1]];
                let c = board[winCondition[2]];
                if (a === "" || b === "" || c === "") {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                messageElement.innerHTML = `Player ${currentPlayer} has won!`;
                isGameActive = false;
                return;
            }

            let roundDraw = !board.includes("");
            if (roundDraw) {
                messageElement.innerHTML = `Game Draw!`;
                isGameActive = false;
                return;
            }

            changePlayer();
        }

        function changePlayer() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            messageElement.innerHTML = `Player ${currentPlayer}'s Turn`;
        }

        function userAction(cell, index) {
            if (isGameActive && board[index] === "") {
                board[index] = currentPlayer;
                cell.innerHTML = currentPlayer;
                handleResultValidation();
            }
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            messageElement.innerHTML = `Player X's Turn`;
            cells.forEach(cell => {
                cell.innerHTML = "";
            });
        }

        cells.forEach((cell, index) => {
            cell.addEventListener('click', () => userAction(cell, index));
        });

        resetButton.addEventListener('click', resetGame);
    </script>
</body>
</html>
