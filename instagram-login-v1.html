
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .login-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            margin: 0 0 10px;
            padding: 10px 0;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .login-container .logo {
            margin: 22px auto 12px;
            width: 175px;
        }

        .login-container .logo img {
            width: 100%;
        }

        .login-container input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px;
            width: 258px;
            margin-bottom: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .login-container button {
            background-color: #0095f6;
            border: 1px solid #0095f6;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            padding: 5px 9px;
            width: 268px;
            margin-top: 8px;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .login-container button:disabled {
            background-color: rgba(0, 149, 246, .3);
            border-color: rgba(0, 149, 246, .3);
            cursor: default;
        }

        .separator {
            display: flex;
            align-items: center;
            margin: 10px 0;
            width: 268px;
        }

        .separator .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .separator .text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            line-height: 15px;
            margin: 0 18px;
        }

        .facebook-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;

        .forgot-password {

        }

        .signup-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;

            text-align: center;

        }

<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://www.instagram.com/static/images/web/logged_out_wordmark.png/7a252de00b20.png" alt="Instagram logo">
        </div>
        <form>
            <input type="text" placeholder="Phone number, username, or email">
            <input type="password" placeholder="Password">
            <button type="submit" disabled>Log In</button>
        </form>
        <div class="separator">
            <div class="line"></div>
            <div class="text">OR</div>
            <div class="line"></div>
        </div>
        <a href="#" class="facebook-login">Log in with Facebook</a>
        <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <div class="signup-container">
        Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="get-app">
        Get the app.
        <div class="app-badges">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on the App Store">
            <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play">
        </div>
